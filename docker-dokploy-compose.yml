version: "2.2"
services:
  web:
    # 注释: 替换为 tobiasunterzeit/php 镜像，该镜像明确支持 arm64 架构
    # 使用 nginx-php-fpm 组合镜像
    image: tobiasunterzeit/php:7.4-fpm-nginx
    
    expose:
      - "80"
      - "9000"
    
    volumes:
      - "../files/dujiaoka/install.lock:/var/www/html/install.lock"
      - "../files/dujiaoka/uploads:/var/www/html/public/uploads"
      # 注释: 添加应用代码挂载，并修改挂载路径以匹配新镜像的工作目录
      - "./:/var/www/html"
    
    environment:
      - TZ=Asia/Shanghai
      # 注释: 添加 PHP 配置环境变量
      - PHP_MEMORY_LIMIT=256M
      - PHP_MAX_EXECUTION_TIME=300
      
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dujiaoka.rule=Host(`your-domain.com`)"
      - "traefik.http.routers.dujiaoka.entrypoints=websecure"
      - "traefik.http.routers.dujiaoka.tls.certResolver=letsencrypt"
      - "traefik.http.services.dujiaoka.loadbalancer.server.port=80"
    
    tty: true
    restart: always
    
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true
