version: "2.2"
services:
  web:
    # 使用支持 ARM64 的镜像
    # 注释: 替换原来的 webdevops/php-nginx:7.4 为支持 ARM 架构的镜像
    image: dwchiang/nginx-php-fpm:7.4
    
    expose:
      - "80"
      - "9000"
    
    volumes:
      - "../files/dujiaoka/.env:/var/www/html/.env"  # 注释: 修改目标路径为新镜像的工作目录
      - "../files/dujiaoka/install.lock:/var/www/html/install.lock"
      - "../files/dujiaoka/uploads:/var/www/html/public/uploads"
    
    environment:
      - TZ=Asia/Shanghai
      # 注释: 删除了 WEB_DOCUMENT_ROOT 因为新镜像使用标准的 nginx 配置
      
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dujiaoka.rule=Host(`your-domain.com`)"
      - "traefik.http.routers.dujiaoka.entrypoints=websecure"
      - "traefik.http.routers.dujiaoka.tls.certResolver=letsencrypt"
      - "traefik.http.services.dujiaoka.loadbalancer.server.port=80"
    
    tty: true
    restart: always
    
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true
