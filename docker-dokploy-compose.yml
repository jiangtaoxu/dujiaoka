# 注释: 移除 version 属性以避免警告
services:
  web:
    # 注释: 使用官方的 arm64 支持的 PHP-FPM 镜像
    image: arm64v8/php:7.4-fpm-alpine
    
    # 注释: 添加必要的 PHP 和 Nginx 安装命令
    command: |
      sh -c "apk add --no-cache nginx && \
             docker-php-ext-install pdo_mysql mysqli && \
             nginx && \
             php-fpm"
    
    expose:
      - "80"
      - "9000"
    
    volumes:
      - "../files/dujiaoka/install.lock:/var/www/html/install.lock"
      - "../files/dujiaoka/uploads:/var/www/html/public/uploads"
      - "./:/var/www/html"
      # 注释: 添加 nginx 配置
      - "./nginx.conf:/etc/nginx/http.d/default.conf"
    
    environment:
      - TZ=Asia/Shanghai
      - PHP_MEMORY_LIMIT=256M
      - PHP_MAX_EXECUTION_TIME=300
      
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dujiaoka.rule=Host(`your-domain.com`)"
      - "traefik.http.routers.dujiaoka.entrypoints=websecure"
      - "traefik.http.routers.dujiaoka.tls.certResolver=letsencrypt"
      - "traefik.http.services.dujiaoka.loadbalancer.server.port=80"
    
    tty: true
    restart: always
    
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true
